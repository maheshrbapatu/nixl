# Build Matrix Configuration for NIXL CI Pipeline (wheels + vLLM/SGLang sanity)
#
# This file builds the NIXL wheels (x86_64 + aarch64) via contrib/build-container.sh +
# contrib/Dockerfile.manylinux, and — on x86_64 only — runs a vLLM/SGLang NIXL
# disaggregation sanity test on the mizu SLURM cluster, reusing the wheels just built.
#
# vLLM/SGLang weights-base images:
#   The verification base images (vllm-nixl-base / sglang-nixl-base = pinned upstream +
#   baked-in test model weights) are built by the ci-demo runs_on_dockers mechanic: ci-demo
#   rebuilds + repushes them only when the Dockerfile changes (or CI_IMAGE_TAG is bumped /
#   the image is missing). The per-PR sanity images are then built FROM those bases with the
#   freshly built wheels layered on top (no second wheel build).
#
# Single-container design: everything runs in the `podman` container (ci-demo branches are
# parallel with no cross-branch ordering, so the wheel build, image build and SLURM steps
# must share one container to stay ordered). scctl (the mizu SLURM client) is installed at
# runtime in a dedicated x86_64-only step, immediately before the SLURM steps, so it is
# clearly scoped to the sanity test.
#
# Note: changes to this file are tested as part of the PR CI flow no need to test them manually.

---
job: nixl-ci-build-wheel

# Fail job if one of the steps fails or continue
failFast: false

# Build timeout - 4 hours for complex multi-architecture builds
timeout_minutes: 240

registry_host: artifactory.nvidia.com
registry_auth: svc-nixl-new-artifactory-token
registry_path: /sw-nbu-swx-nixl-docker-local/ci

credentials:
  - credentialsId: 'svc-nixl-new-artifactory-token'
    usernameVariable: 'ARTIFACTORY_USER'
    passwordVariable: 'ARTIFACTORY_TOKEN'

kubernetes:
  cloud: il-ipp-blossom-prod
  namespace: nbu-swx-nixl
  imagePullSecrets: "['artifactory-pull-secret']"
  # 24GB memory and 16 CPU cores for parallel compilation and large builds
  limits: '{memory: 24Gi, cpu: 16000m}'
  requests: '{memory: 24Gi, cpu: 16000m}'

# Job-id files for SLURM allocations (sanity test) live on the shared PVC.
pvc_volumes:
  - {claimName: nbu-swx-nixl-pvc, mountPath: /mnt/pvc, readOnly: false}

# Podman builds the wheels and the per-PR sanity images, and runs the SLURM steps.
# The vLLM/SGLang weights-base images are built by ci-demo (file:) and only rebuilt when
# their Dockerfile changes / CI_IMAGE_TAG is bumped. They are x86_64-only and category
# 'tool' (built + pushed, but no pipeline steps run inside them).
runs_on_dockers:
  - { name: "podman", url: "quay.io/podman/stable:v5.7.1", privileged: true }
  - {
      name: "vllm-nixl-base",
      file: "contrib/Dockerfile.vllm-base",
      tag: "${CI_IMAGE_TAG}",
      arch: "x86_64",
      category: "tool",
      build_args: '--build-arg BASE_IMAGE=${VLLM_BASE_UPSTREAM} --build-arg MODEL_ID=${SANITY_MODEL_ID}'
    }
  - {
      name: "sglang-nixl-base",
      file: "contrib/Dockerfile.sglang-base",
      tag: "${CI_IMAGE_TAG}",
      arch: "x86_64",
      category: "tool",
      build_args: '--build-arg BASE_IMAGE=${SGLANG_BASE_UPSTREAM} --build-arg MODEL_ID=${SANITY_MODEL_ID}'
    }

matrix:
  axes:
    manylinux:
      - "2_28"
    python_version:
      - "3.12"
    arch:
      - x86_64
      - aarch64

env:
  NPROC: 16
  GRPC_NPROC: 10
  BASE_IMAGE: "${registry_host}/sw-nbu-swx-nixl-docker-local/base/cuda"
  BASE_TAG: '13.0-devel-manylinux--25.09'
  # Per-PR sanity images: <registry_host><registry_path>/pr/<arch>/<fw>-nixl:<sha1>
  PR_REGISTRY: "${registry_host}${registry_path}"
  # ci-demo-built weights-base images (bump CI_IMAGE_TAG or edit the base Dockerfile to rebuild)
  CI_IMAGE_TAG: "20260624-2"
  SANITY_MODEL_ID: "Qwen/Qwen3-1.7B"
  # Fully qualified (docker.io/) — podman short-name-mode=enforcing cannot resolve bare names.
  VLLM_BASE_UPSTREAM: "docker.io/vllm/vllm-openai:v0.23.0"
  SGLANG_BASE_UPSTREAM: "docker.io/lmsysorg/sglang:v0.5.13.post1"
  # SLURM (mizu) — sanity test only, x86_64
  SLURM_NODES: 1
  SLURM_PARTITION: mizu
  SLURM_HEAD_NODE: scctl
  SLURM_GRES: gpu:2
  SLURM_MEM: 128G
  SLURM_MINCPUS: 24
  SLURM_JOB_TIMEOUT: '01:30:00'
  SLURM_IMMEDIATE_TIMEOUT: "3600"
  SCCTL_CREDENTIALS_ID: 'svc-nixl-scctl'
  JOB_ID_FILE_ROOT: "/mnt/pvc/${JOB_BASE_NAME}"
  STORAGE_DRIVER: overlay

steps:
  # =============================================================================
  # Step 1: Environment Preparation (both arches)
  # =============================================================================
  - name: Prepare
    credentialsId: 'svc-nixl-new-artifactory-token'
    parallel: false
    run: |
      # Setup podman and dependencies
      rm -f /etc/containers/storage.conf /usr/share/containers/storage.conf
      podman system reset -f || true
      ln -sfT $(type -p podman) /usr/bin/docker
      # Login to Artifactory
      echo "$ARTIFACTORY_TOKEN" | docker login "https://${registry_host}" -u "$ARTIFACTORY_USER" --password-stdin

  # =============================================================================
  # Step 2: Python Wheel Generation (both arches)
  # =============================================================================
  - name: Build Wheel
    parallel: false
    run: |
      set -x
      export NPROC=$NPROC
      export GRPC_NPROC=$GRPC_NPROC
      ./contrib/build-container.sh \
        --base-image "${BASE_IMAGE}" \
        --base-image-tag "${BASE_TAG}" \
        --wheel-base "manylinux_${manylinux}" \
        --python-versions "${python_version}" \
        --arch ${arch} \
        --dockerfile contrib/Dockerfile.manylinux

  # =============================================================================
  # Step 3: Build per-PR vLLM/SGLang sanity images (x86_64 only)
  # =============================================================================
  # Reuse the wheels just built (no second wheel build): extract them from the manylinux
  # image, then build one image per framework FROM the ci-demo-built weights-base, layering
  # the PR wheels on top (Dockerfile.vllm / Dockerfile.sglang force-reinstall them). Tagged
  # by the PR-merged commit SHA so the SLURM run pulls the exact image.
  - name: Build framework sanity images
    containerSelector: "{name: 'podman', arch: 'x86_64'}"
    credentialsId: 'svc-nixl-new-artifactory-token'
    parallel: false
    run: |
      set -eux
      echo "$ARTIFACTORY_TOKEN" | docker login "https://${registry_host}" -u "$ARTIFACTORY_USER" --password-stdin

      # build-container.sh (no --tag) tags the wheel image nixl:<VERSION>; match only that
      # local reference (the manylinux base repo path also contains "nixl").
      WHEEL_IMAGE="$(docker images --filter 'reference=nixl:*' --format '{{.Repository}}:{{.Tag}}' | head -n1)"
      test -n "$WHEEL_IMAGE"
      echo "Extracting wheels from ${WHEEL_IMAGE}"

      WHEELS_DIR="$(pwd)/pr-wheels-${arch}"
      rm -rf "$WHEELS_DIR" && mkdir -p "$WHEELS_DIR"
      docker create --name "wheel-extract-${arch}" "$WHEEL_IMAGE"
      docker cp "wheel-extract-${arch}:/workspace/nixl/dist/." "$WHEELS_DIR/"
      docker rm -f "wheel-extract-${arch}"
      ls "$WHEELS_DIR"/*.whl

      for fw in vllm sglang; do
        BASE="${PR_REGISTRY}/${arch}/${fw}-nixl-base:${CI_IMAGE_TAG}"
        IMG="${PR_REGISTRY}/pr/${arch}/${fw}-nixl:${sha1}"
        # 1. Layer the freshly built wheels onto the weights-base (wheels-only context).
        docker build --platform linux/${arch} \
          --build-arg BASE_IMAGE="${BASE}" \
          -f contrib/Dockerfile.${fw} \
          -t "${IMG}" \
          "$WHEELS_DIR/"
        # 2. Bake the sanity script in at a fixed absolute path so the SLURM run can invoke
        #    it regardless of the image's workdir/entrypoint. Done here (not in the shared
        #    Dockerfile.${fw}, which is also used for release images) via a stdin Dockerfile
        #    with the repo root as context. common.sh is baked in too so the sanity script
        #    can reuse get_next_tcp_port for host-unique ports (concurrent jobs share a node).
        printf 'FROM %s\nCOPY .gitlab/test_vllm_sglang_sanity.sh /usr/local/bin/nixl_sanity.sh\nCOPY .ci/scripts/common.sh /usr/local/bin/common.sh\nRUN chmod +x /usr/local/bin/nixl_sanity.sh\n' "${IMG}" \
          | docker build --platform linux/${arch} -t "${IMG}" -f - .
        docker push "${IMG}"
      done

  # =============================================================================
  # Step 4: Install the mizu SLURM client (x86_64 only, sanity test only)
  # =============================================================================
  - name: Install scctl (sanity only)
    containerSelector: "{name: 'podman', arch: 'x86_64'}"
    parallel: false
    run: |
      set -eux
      curl -s https://urm.nvidia.com/artifactory/sw-swx-lab-infra-generic/scctl/get-app.sh \
        | bash -s -- --output-dir /usr/local/bin
      scctl --version || true

  # =============================================================================
  # Step 5: Allocate a mizu GPU node (x86_64 only)
  # =============================================================================
  - name: Allocate Environment
    containerSelector: "{name: 'podman', arch: 'x86_64'}"
    parallel: false
    shell: action
    module: slurmCI
    run: allocation
    args:
      partition: "${SLURM_PARTITION}"
      headNode: "${SLURM_HEAD_NODE}"
      nodes: "${SLURM_NODES}"
      jobTimeout: "${SLURM_JOB_TIMEOUT}"
      immediateTimeout: "${SLURM_IMMEDIATE_TIMEOUT}"
      jobName: "nixl-vs-${BUILD_NUMBER}"
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${BUILD_NUMBER}.txt"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      extraArgs: [
        "--gres=${SLURM_GRES}",
        "--mincpus=${SLURM_MINCPUS}",
        "--mem=${SLURM_MEM}"
      ]

  # =============================================================================
  # Step 6: vLLM disaggregation sanity (x86_64 only)
  # =============================================================================
  - name: Run vLLM sanity
    containerSelector: "{name: 'podman', arch: 'x86_64'}"
    timeout: 40
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${BUILD_NUMBER}.txt"
      testScript: "/usr/local/bin/nixl_sanity.sh vllm"
      headNode: "${SLURM_HEAD_NODE}"
      dockerImage: "${registry_host}#${registry_path}/pr/${arch}/vllm-nixl:${sha1}"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      containerName: "nixl-vs-vllm-${BUILD_NUMBER}"

  # =============================================================================
  # Step 7: SGLang disaggregation sanity (x86_64 only)
  # =============================================================================
  - name: Run SGLang sanity
    containerSelector: "{name: 'podman', arch: 'x86_64'}"
    timeout: 40
    parallel: false
    shell: action
    module: slurmCI
    run: run
    args:
      jobIdFile: "${JOB_ID_FILE_ROOT}/job_id_${BUILD_NUMBER}.txt"
      testScript: "/usr/local/bin/nixl_sanity.sh sglang"
      headNode: "${SLURM_HEAD_NODE}"
      dockerImage: "${registry_host}#${registry_path}/pr/${arch}/sglang-nixl:${sha1}"
      credentialsId: "${SCCTL_CREDENTIALS_ID}"
      containerName: "nixl-vs-sglang-${BUILD_NUMBER}"

# Release the SLURM allocation. pipeline_stop runs in a FRESH podman pod (not the
# per-branch one), so the runtime-installed scctl is gone — reinstall it here before the
# teardown. Best-effort: a teardown failure must not fail the build. No-op when no
# allocation was made (aarch64 cell / sanity skipped), since the jobId dir will be empty.
pipeline_stop:
  containerSelector: "{name: 'podman'}"
  shell: action
  module: groovy
  run: |
    try {
      sh(label: 'install scctl', script: 'curl -s https://urm.nvidia.com/artifactory/sw-swx-lab-infra-generic/scctl/get-app.sh | bash -s -- --output-dir /usr/local/bin')
      slurm.stopAllForBuild(
        credentialsId: env.SCCTL_CREDENTIALS_ID,
        headNode: env.SLURM_HEAD_NODE,
        jobIdDir: env.JOB_ID_FILE_ROOT
      )
    } catch (e) {
      echo "pipeline_stop: failed to release SLURM allocation (non-fatal): ${e}"
    }

# =============================================================================
# Task Naming Convention
# =============================================================================
taskName: '${name}_${manylinux}/${arch}/python_${python_version}'
